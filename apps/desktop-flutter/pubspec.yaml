name: webhtv_pc
description: "WebHTV PC 桌面播放器（Windows 优先）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 播放器：Phase 0 ADR-0001 冻结 media-kit 为主引擎。
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1
  window_manager: ^0.5.2

  # 网络与协议
  http: ^1.6.0
  # 直播弹幕（§13.1）需要 WebSocket；选 web_socket_channel 是因为它支持
  # 自定义 headers（Referer/Cookie）与 pingInterval/connectTimeout，
  # 而 dart:io 的裸 WebSocket 与 web_socket 包都不带 headers 参数。
  web_socket_channel: ^3.0.3
  xml: ^7.0.1
  crypto: ^3.0.7
  # 本地备份 zip（Phase 9 · P2-7）。此前由 flutter_test 链传递依赖；显式声明
  # 避免未来传递链变化导致编译失败。
  archive: ^4.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  brotli: ^0.6.0
  fast_gbk: ^1.0.0
  # 字幕的 Big5 / Shift-JIS / EUC-KR：纯 Dart 表实现，不依赖原生 iconv。
  # 选型与验收见 docs/phase9/evidence/12-subtitle-charset-extension.md。
  charset: ^2.0.1
  enough_convert: ^1.7.1
  cp949_codec: ^1.0.2
  sqlite3: ^3.1.0
  sqlite3_flutter_libs: ^0.5.30
  # FFI：Windows Job Object 进程隔离（§9.8、§18.2.1）。
  ffi: ^2.1.3
  # POSIX 目录身份（st_dev/st_ino）：本地源导入回滚要用它证明「还是我创建的那个
  # 目录」。Windows 侧仍走 win32 文件 ID，两者语义等价。
  posix: ^6.5.2
  sherpa_onnx: 2.0.1
  # 追番新集系统通知（Windows toast，经 local_notifier / WinToast）。
  # 选型、版本与失败降级见 docs/adr/0006-following-system-notification.md。
  local_notifier: ^0.1.6
  file_picker: ^13.3.3
  webview_windows: ^0.4.0
  canvas_danmaku: ^0.3.4
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # 内置 LUT（13 个 33³/17³/16³ .cube，对齐安卓 assets/lut_presets）。
    # 播放前由 LutStore 落到缓存目录，再交给 mpv 的 lut3d 滤镜。
    - assets/lut/
    - assets/models/basic_pitch_nmp.tflite
    - lib/core/audio_ai/RESOURCE_SOURCES.md
