name: webhtv_pc
description: "WebHTV PC 桌面播放器（Windows 优先）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 播放器：Phase 0 ADR-0001 冻结 media-kit 为主引擎。
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  window_manager: ^0.5.2

  # 网络与协议
  http: ^1.6.0
  xml: ^7.0.1
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  brotli: ^0.6.0
  fast_gbk: ^1.0.0
  sqlite3: ^3.1.0
  sqlite3_flutter_libs: ^0.5.30
  # FFI：Windows Job Object 进程隔离（§9.8、§18.2.1）。
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
