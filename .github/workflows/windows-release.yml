name: Windows Release

# 手动发布：Windows x64 便携包 + 校验文件 + GitHub Release。
# 语义对齐安卓仓库 .github/workflows/android-release.yml：
#   - tag：v<versionName>-yyyyMMddHHmm（stable）/ v<versionName>-beta-yyyyMMddHHmm（beta）；
#   - 通道 auto：main → stable，其它分支 → beta；beta 强制预发布；
#   - 同一 commit 重跑复用 tag、覆盖同名资产，不移动 tag；
#   - 发布门禁（analyze + 单测）不过不产出 Release。
#
# 当前发布形态与限制（诚实披露，不生成应用不消费的更新通道）：
#   - 便携 zip，不含 MSI 安装包；
#   - 无自动更新（docs/phase9/README.md P2-7：更新签名通道未定）；
#   - 代码签名为可选：配置 secrets 后签名，否则在 notes/BUILD_INFO/release-info.json 标注未签名；
#   - 包内自带 Node 运行时（runtime/node/node.exe，v22.23.4）与经锁定校验的离线 Python；
#     Python 运行/修复不联网；JVM 站源仍需要本机安装 JDK 17+。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, blank = v<versionName>-yyyyMMddHHmm or v<versionName>-beta-yyyyMMddHHmm"
        required: false
        type: string
      release_channel:
        description: "Release channel, auto uses beta on non-main branches and stable on main"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - beta
      release_notes:
        description: "Release notes, use \\n for Markdown newlines"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Create/update the GitHub Release (false = build and upload workflow artifacts only)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  FLUTTER_VERSION: "3.47.5"

jobs:
  release:
    name: Build, package and publish (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up JDK 21 (JVM sidecar tests)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 22 (JS sidecar tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # node_modules 不入库（.gitignore:51），但 scripts/package_windows.ps1 要求
      # sidecars/spider-host-js/node_modules 存在，缺失即打包失败。必须在打包前安装；
      # 用 npm ci 按已入库的 package-lock.json 精确还原，--omit=dev 避免把开发依赖打进包。
      - name: Install JS sidecar dependencies
        working-directory: sidecars/spider-host-js
        shell: pwsh
        run: npm ci --omit=dev

      - name: Set up Python 3.12 (Python sidecar tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Windows long paths and symlink support
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          git config --system core.longpaths true
          if ($LASTEXITCODE -ne 0) {
            Write-Warning '无法写入 core.longpaths（非管理员）；路径较短时通常不影响构建。'
          }
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Warning '无法通过注册表启用开发者模式；若 flutter pub get 因插件符号链接失败，请检查 runner 权限。'
          }

      # 先解析元数据：非法 tag / 指向别的 commit 的 tag 应在跑 13 分钟单测之前失败。
      - name: Resolve release metadata
        id: meta
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          RELEASE_CHANNEL_INPUT: ${{ inputs.release_channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $pubspec = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop-flutter/pubspec.yaml'
          $line = Select-String -Path $pubspec -Pattern '^version:\s*([^\s#]+)\s*$' | Select-Object -First 1
          if (-not $line) { throw 'apps/desktop-flutter/pubspec.yaml 缺少 version 字段' }
          $full = $line.Matches[0].Groups[1].Value
          $parsed = [regex]::Match($full, '^(\d+\.\d+\.\d+)(?:\+(\d+))?$')
          if (-not $parsed.Success) { throw "非法版本号：$full（期望 x.y.z 或 x.y.z+build）" }
          $version = $parsed.Groups[1].Value
          $build = if ($parsed.Groups[2].Success) { $parsed.Groups[2].Value } else { '0' }

          $channel = "$env:RELEASE_CHANNEL_INPUT".Trim()
          if ([string]::IsNullOrWhiteSpace($channel) -or $channel -eq 'auto') {
            $channel = if ($env:GITHUB_REF_NAME -eq 'main') { 'stable' } else { 'beta' }
          }
          if ($channel -notin @('stable', 'beta')) {
            throw "非法 release_channel：$channel（只接受 auto / stable / beta）"
          }

          $suffix = if ($channel -eq 'beta') { '-beta' } else { '' }
          $epoch = [long]((git show -s --format=%ct $env:GITHUB_SHA).Trim())
          $utc = [DateTimeOffset]::FromUnixTimeSeconds($epoch).UtcDateTime
          $cnTz = [TimeZoneInfo]::FindSystemTimeZoneById('China Standard Time')
          $tagTime = [TimeZoneInfo]::ConvertTimeFromUtc($utc, $cnTz).ToString('yyyyMMddHHmm')

          $tagInput = "$env:RELEASE_TAG_INPUT".Trim()
          $tag = if ([string]::IsNullOrWhiteSpace($tagInput)) { "v$version$suffix-$tagTime" } else { $tagInput }
          $escapedVersion = [regex]::Escape($version)
          $pattern = if ($channel -eq 'beta') { "^v$escapedVersion-beta-\d{12}$" } else { "^v$escapedVersion-\d{12}$" }
          $expected = if ($channel -eq 'beta') { "v$version-beta-yyyyMMddHHmm" } else { "v$version-yyyyMMddHHmm" }
          if ($tag -notmatch $pattern) {
            throw "非法 release tag：$tag（通道 $channel 期望 $expected）"
          }

          $existing = & git rev-parse --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($existing)) {
            $existingCommit = $existing.Trim()
            if ($existingCommit -ne $env:GITHUB_SHA) {
              throw "tag $tag 已指向 $existingCommit，不是当前 commit $env:GITHUB_SHA；不会移动既有 tag。"
            }
            Write-Host "::notice title=复用 release tag::$tag 已指向当前 commit。"
          }

          $title = $tag.Substring(1)
          $short = (git rev-parse --short=7 HEAD).Trim()
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_suffix=$suffix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short_sha=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_beta=$(($channel -eq 'beta').ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release：tag=$tag version=$version build=$build channel=$channel commit=$short"

      - name: Install Dart dependencies
        working-directory: apps/desktop-flutter
        shell: pwsh
        run: flutter pub get

      - name: Static analysis
        working-directory: apps/desktop-flutter
        shell: pwsh
        run: dart analyze

      # 顺序要点：先 Release 构建，再跑单测。
      # 13 个 phase8 播放器用例会真实实例化 media_kit 的 NativePlayer，而
      # media_kit 在 Windows 上要求 `libmpv-2.dll` 位于 `%PATH%`；该 DLL 由
      # media_kit_libs_windows_video 的 CMake 在原生构建时下载解压到
      # build/windows/x64/libmpv/。开发机 PATH 里恰好有 libmpv 才显得无关，
      # CI 必须显式补 PATH，不能靠跳过用例掩盖。
      - name: Prepare verified offline Python runtime
        shell: pwsh
        run: |
          ./scripts/prepare_python_runtime.ps1
          ./scripts/test_python_runtime.ps1 -Review -Integration
      - name: Build Windows release
        working-directory: apps/desktop-flutter
        shell: pwsh
        run: flutter build windows --release "--dart-define=APP_VERSION=${{ steps.meta.outputs.version }}"

      - name: Unit tests
        working-directory: apps/desktop-flutter
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $libmpv = Get-ChildItem -Path 'build/windows/x64' -Filter 'libmpv-2.dll' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $libmpv) {
            throw '未找到 libmpv-2.dll：media_kit 的播放器用例无法运行（Release 构建应已下载解压它）。'
          }
          Write-Host "libmpv：$($libmpv.FullName)"
          $env:PATH = "$($libmpv.Directory.FullName);$env:PATH"
          flutter test

      # 可选代码签名：配置了 secrets 就必须成功，不静默降级成未签名。
      - name: Configure code signing (optional)
        id: sign
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
          CERT_TIMESTAMP_URL: ${{ vars.WINDOWS_CERT_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop-flutter/build/windows/x64/runner/Release/webhtv_pc.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "未找到构建产物：$exe" }
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            Write-Warning '未配置 WINDOWS_CERT_PFX_BASE64，产物保持未签名（会写入发布说明与 release-info.json）。'
            'signed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            return
          }
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_PASSWORD)) {
            throw '配置了 WINDOWS_CERT_PFX_BASE64 但缺少 WINDOWS_CERT_PFX_PASSWORD。'
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'webhtv-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object -Property FullName | Select-Object -Last 1
            if (-not $signtool) { throw '未找到 Windows SDK 的 signtool.exe，无法签名。' }
            $timestamp = if ([string]::IsNullOrWhiteSpace($env:CERT_TIMESTAMP_URL)) { 'http://timestamp.digicert.com' } else { $env:CERT_TIMESTAMP_URL }
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:CERT_PFX_PASSWORD /tr $timestamp /td SHA256 /v $exe
            if ($LASTEXITCODE -ne 0) { throw 'signtool sign 失败。' }
            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw 'signtool verify 失败。' }
            $signature = Get-AuthenticodeSignature -LiteralPath $exe
            if ($signature.Status.ToString() -ne 'Valid') {
              throw "签名状态不是 Valid：$($signature.Status)"
            }
            'signed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "已签名：$($signature.SignerCertificate.Subject)"
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare release notes
        id: notes
        shell: pwsh
        env:
          RAW_NOTES: ${{ inputs.release_notes }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = $env:RAW_NOTES
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = '手动触发 GitHub Actions 构建发布。'
          } else {
            $notes = $notes.Replace('\r\n', "`n").Replace('\n', "`n").Replace('\t', "`t").Replace('\"', '"').Replace("\'", "'")
          }

          $extra = @()
          if ($env:SIGNED -ne 'true') {
            $extra += '> **未签名包**：本可执行文件未做代码签名，Windows SmartScreen 可能提示「未知发布者」。这是当前发布形态，不是下载损坏。'
          }
          $extra += '> **运行环境**：包内自带 Node 运行时（runtime/node/node.exe，v22.23.4），Node Spider 开箱即用，无需自行安装 Node。Python 3.14.10 运行时与依赖已内置，可离线准备和修复，运行/修复不联网，无需安装系统 Python。只有 JVM Spider 对应站源仍需本机安装 JDK 17+。'

          $body = ($notes.TrimEnd() + "`n`n" + ($extra -join "`n`n") + "`n")
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'build') | Out-Null
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'build/release-notes.md'), $body, [Text.UTF8Encoding]::new($false))

          $isPrerelease = ('${{ steps.meta.outputs.is_beta }}' -eq 'true') -or ('${{ inputs.prerelease }}' -eq 'true')
          "is_prerelease=$($isPrerelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host $body

      - name: Package portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/package_windows.ps1 `
            -BuildDir 'apps/desktop-flutter/build/windows/x64/runner/Release' `
            -OutputDir 'dist' `
            -Version '${{ steps.meta.outputs.version }}' `
            -BuildNumber '${{ steps.meta.outputs.build }}' `
            -Channel '${{ steps.meta.outputs.channel }}' `
            -Tag '${{ steps.meta.outputs.tag }}' `
            -Commit "$env:GITHUB_SHA" `
            -ShortCommit '${{ steps.meta.outputs.short_sha }}' `
            -FlutterVersion "$env:FLUTTER_VERSION" `
            -NotesFile 'build/release-notes.md'

      - name: Smoke test packaged client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -LiteralPath 'dist' -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'dist 下没有 zip' }
          $extract = Join-Path $env:RUNNER_TEMP ('webhtv-smoke-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force
          $exe = Get-ChildItem -LiteralPath $extract -Recurse -Filter 'webhtv_pc.exe' | Select-Object -First 1
          if (-not $exe) { throw '解压后未找到 webhtv_pc.exe' }
          ./scripts/smoke_windows.ps1 -ExePath $exe.FullName -ExpectedVersion '${{ steps.meta.outputs.version }}'

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.notes.outputs.is_prerelease }}
          NOTES_FILE: build/release-notes.md
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $assets = @(Get-ChildItem -LiteralPath 'dist' -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw 'dist 下没有可发布资产。' }
          $notesFile = Join-Path $env:GITHUB_WORKSPACE $env:NOTES_FILE
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) { throw "发布说明不存在：$notesFile" }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG 已存在：覆盖同名资产并刷新说明。"
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'gh release upload 失败。' }
            $editArgs = @('release', 'edit', $env:RELEASE_TAG, '--title', $env:RELEASE_TITLE, '--notes-file', $notesFile)
            if ($env:RELEASE_PRERELEASE -eq 'true') { $editArgs += '--prerelease' } else { $editArgs += '--prerelease=false' }
            gh @editArgs
            if ($LASTEXITCODE -ne 0) { throw 'gh release edit 失败。' }
          } else {
            $createArgs = @('release', 'create', $env:RELEASE_TAG, '--target', $env:GITHUB_SHA, '--title', $env:RELEASE_TITLE, '--notes-file', $notesFile)
            if ($env:RELEASE_PRERELEASE -eq 'true') { $createArgs += '--prerelease' }
            $createArgs += $assets
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw 'gh release create 失败。' }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-pc-${{ steps.meta.outputs.tag }}-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
